server {
  server_name 0.0.0.0;
  listen 80;


  location / {
    root /usr/share/nginx/html;
    index index.html;
    # index.html, env.js, translations and data files are not fingerprinted:
    # browsers must revalidate them, or they keep running an old release.
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }

  # Fingerprinted build output (main-AB12CD34.js, styles-...css, chunk-...js) never changes
  location ~ "^/in-person-portal/[^/]+-[A-Z0-9]{8}\.(js|css)$" {
    root /usr/share/nginx/html;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }
}
