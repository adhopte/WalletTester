apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: in-person-portal
  name: in-person-portal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: in-person-portal
  strategy:
    rollingUpdate:
      maxSurge: {{.Values.strategy.rollingUpdate.maxSurge}}
      maxUnavailable: {{.Values.strategy.rollingUpdate.maxUnavailable}}
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: in-person-portal
    spec:
      {{ if .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      {{ end }}
      serviceAccountName: in-person-portal
      imagePullSecrets: {{- toYaml .Values.global.imagePullSecrets | nindent 8 }}
      containers:
        - image: {{.Values.image.registry}}/{{.Values.image.repo}}:{{.Values.image.tag}}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          name: in-person-portal
          env:
            - name: DEFAULT_FLOWS
              value: {{ .Values.flows.default | toJson | quote }}
            - name: HOST_SPECIFIC_FLOWS
              value: {{ .Values.flows.hosts | toJson | quote }}
            {{- with .Values.extraEnv }}
            {{ toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - containerPort: 80
              name: http
              protocol: TCP
            - containerPort: 8082
              name: sor
              protocol: TCP
          {{- if .Values.additionalVolumeMounts }}
          volumeMounts:
            {{- with .Values.additionalVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          resources:
          {{- toYaml .Values.resources | nindent 12 }}
      {{- if .Values.additionalVolumes }}
      volumes:
        {{- with .Values.additionalVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      terminationGracePeriodSeconds: 30
