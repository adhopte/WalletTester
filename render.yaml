# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: civic-portal
    runtime: docker
    dockerfilePath: ./Dockerfile.render
    branch: civic-portal
    plan: free
    healthCheckPath: /in-person-portal/
    envVars:
      # OID4VCI credential issuer (metadata: <ISSUER_URL>/.well-known/openid-credential-issuer).
      # Offer and metadata calls are proxied through this service's nginx, so no CORS setup is
      # needed on the issuer. Defaults to the eu-wallet prep issuer when not set.
      - key: ISSUER_URL
        value: https://issuer.eu-wallet.prep.smartid.nuagein.io
      # Use cases listed on the home page
      - key: PORTAL_USE_CASES
        value: '["oid_pid_mdoc_uc1","oid_birth_certificate_sd_jwt_uc1"]'
      # GIPS API base URL (needed for the "classic" and DTC use cases); leave empty if unused
      - key: GIPS_UPSTREAM
        sync: false
