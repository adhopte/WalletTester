<div class="app-container">
  <div class="container-fluid " style="margin-top:15px">
    <!-- FORM START -->
    <form [formGroup]="attributeForm" name="attributeForm" (ngSubmit)="onSubmit()">

      <div class="row row-eq-height">
        <!--<div class="col-sm-2">
        </div>-->
        <div class="col-sm-4">
          <div class="row">
            <div class="col">
              <label class="titleBar center">{{ 'attributes.contactDetails' | translate }}</label>
              <div class="app-card cardSetting">

                <!-- EMAIL FIELD -->
                <div class="form-group">
                  <label for="email">{{ 'attributes.email' | translate }}</label>
                  <input type="text" formControlName="email" class="form-control" />
                </div>


                <!-- PHONE FIELD -->
                <div class="form-group">
                  <label for="phone">{{ 'attributes.phoneOptional' | translate }}</label>
                  <input type="text" formControlName="phone" class="form-control" />
                </div>
              </div>
            </div>
          </div>
          <div class="row">
            <br>
          </div>
          <div class="row">
            <div class="col">
              <label class="titleBar center">{{ 'attributes.documentDetails' | translate }}</label>
              <div class="app-card cardSetting">

                <!-- DOC NUMBER -->
                <div class="form-group">
                  <label for="documentNumber">{{ 'attributes.documentNumber' | translate }}</label>
                  <input type="text" formControlName="documentNumber" class="form-control" />
                </div>

                <div class="form-group">
                  <label for="jurisdictionId">{{ 'attributes.jurisdictionId' | translate }}</label>
                  <input type="text" formControlName="jurisdictionId" class="form-control" />
                </div>

              </div>
            </div>
          </div>
          <div class="row">
            <br>
          </div>
          <div class="row">
            <div class="col">
              <label class="titleBar center">{{ 'attributes.dtc' | translate }}</label>
              <div class="app-card cardSetting">
                <div class="form-group">
                  <label for="DTC">{{ 'attributes.dtcValue' | translate }}</label>
                  <input type="text" formControlName="DTC" class="form-control" />
                </div>
                <div class="image-box">
                  <div class="image-upload">
                    <label for="text-input">
                      <img src="./assets/images/add-potrait.png" />
                    </label>
                    <input id="text-input" type="file" (change)="textFileChangeEvent($event)" />
                  </div>
                </div>
              </div>
            </div>
          </div>

        </div>

        <!-- Identity Details -->

        <div class="col-sm-4">
          <label class="titleBar center">{{ 'attributes.identityDetails' | translate }}</label>
          <!-- GIVEN NAMES FEILD -->
          <div class="app-card cardSetting">
            <div class="form-group">
              <label for="givenNames">{{ 'attributes.givenNames' | translate }}</label>
              <div>
                <input id="givenNames" type="text" formControlName="givenNames" class="form-control" />
                <div style="margin-top: 5px;">
                  <img class="imgAddname" src="./assets/images/add-name.png" style="margin-bottom: 10px" (click)="addGivenNames()" />
                  <div class="chip" *ngFor="let item of arrayGivenNames; let i = index">
                    {{arrayGivenNames[i]}}
                    <span class="closebtn" (click)="deleteGivenNames(i)">&times;</span>
                  </div>
                </div>
              </div>
            </div>


            <!-- SURNAME FORM -->
            <div class="form-group">
              <label for="surname">{{ 'attributes.surname' | translate }}</label>
              <input type="text" formControlName="surname" class="form-control" />
              <div class="form-control-feedback" *ngIf="surname?.errors && (surname?.dirty || surname?.touched)">
                <p *ngIf="surname?.errors['required']">{{ 'attributes.surnameRequired' | translate }}</p>
              </div>
            </div>

            <!-- GENDER -->
            <div class="form-group">
              <label for="gender">{{ 'attributes.gender' | translate }}</label>
              <select formControlName="gender" class="form-control" >
                <option value="M" selected >{{ 'attributes.male' | translate }}</option>
                <option value="F">{{ 'attributes.female' | translate }}</option>
                <option value="X">{{ 'attributes.others' | translate }}</option>
              </select>
            </div>

            <!-- PLACE OF BIRTH FEILD -->
            <div class="form-group">
              <label for="placeOfBirth">{{ 'attributes.placeOfBirth' | translate }}</label>
              <input type="text" formControlName="placeOfBirth" class="form-control" />
            </div>

            <div class="form-group">
              <label for="personalNumber">{{ 'attributes.personalNumber' | translate }}</label>
              <input type="text" formControlName="personalNumber" class="form-control" />
            </div>


            <!-- DATE OF BIRTH  FEILD-->
            <div class="form-group">
              <label for="dateOfBirth">{{ 'attributes.dateOfBirth' | translate }}</label>
              <input type="input" formControlName="dateOfBirth" class="form-control" />
            </div>

            <!-- NATIONALITY FORM -->
            <div class="form-group">
              <label for="nationality">{{ 'attributes.nationality' | translate }}</label>
              <input type="text" formControlName="nationality" class="form-control" />
            </div>

            <!-- FAMILY NAME FORM -->
            <div class="form-group">
              <label for="familyName">{{ 'attributes.familyName' | translate }}</label>
              <input type="input" formControlName="familyName" class="form-control" />
            </div>
            <br/>

            <div class="form-group">
              <label for="is18">{{ 'attributes.isOver18' | translate }}</label>
              <input type="checkbox" formControlName="is18" class="form-control" />
            </div>

            <div class="form-group">
              <label for="Actions"></label>
            </div>
          </div>
        </div>

        <!-- Image and additional attribute feild -->
        <div class="col-sm-4">
          <label class="titleBar center">{{ 'attributes.additionalData' | translate }}</label>
          <div class="app-card cardSetting" >

            <div>
              <div class="image-box">
                <img class="potrait" id="preview" [src]="urlBase64" border="3">
              </div>
              <div class="image-box small">(W:991px, H:1322px)</div>
              <div class="image-box">
                <div class="image-upload">
                  <label for="file-input">
                    <img src="./assets/images/add-potrait.png" />
                  </label>
                  <input id="file-input" type="file" (change)="fileChangeEvent($event)" />
                </div>
              </div>

            </div>

            <div class="form-group" style="text-align: center;">
              <div style="width:100%">
                <label class="lineTitle">{{ 'attributes.additionalAttribute' | translate }}</label>
              </div>
              <div class="row">
                <div class="col-4">
                  <div class="form-group">
                    <label for="key">{{ 'attributes.name' | translate }}</label>
                    <input type="text" formControlName="key" class="form-control" />
                  </div>
                </div>
                <div class="col-4">
                  <div class="form-group">
                    <label for="value">{{ 'attributes.value' | translate }}</label>
                    <input type="text" formControlName="value" class="form-control" />
                  </div>
                </div>
                <div class="col-3">
                  <div class="center">
                    <img class="imgAddname" src="./assets/images/add-name.png" (click)="addAdditionalAttributes()" />
                  </div>
                </div>
                <div style="width: 100%;">
                  <div class="fullview" *ngFor="let item of attributeArray; let i = index">
                    <div class="attrContainer" style="background-color:#f9cd88;">
                      <label class="text">
                        <b>{{item.name}}</b><br>
                        <i>{{item.value.substr(0,200)}}.....</i>
                      </label>
                      <div style="height: 20px">
                        <label class="attrDelete" (click)="deleteAttribute(i)">{{ 'common.delete' | translate }}</label>
                      </div>
                    </div>
                  </div>
                </div>
              </div>

            </div>

            <div class="form-group">
              <label class="error-box">{{errorResponse}}</label>
            </div>

            <div class="right-div">
              <button class="button" style="margin-bottom: 10px" (onClick)="onSubmit()" [disabled]="isDisabled()">{{ 'common.submit' | translate }}</button>
            </div>
            <!-- empty label to use as space : no time to look in detail -->
            <div class="form-group">
              <label for="Actions"></label>
            </div>
          </div>
        </div>
        <!--<div class="col-sm-2">
        </div>-->
      </div>
      <!-- FORM END -->
    </form>
  </div>
</div>
