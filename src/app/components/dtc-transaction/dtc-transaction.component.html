<div class="app-container">
  <div class="container-fluid " style="margin-top:15px">
    <div class="row">
      <div class="col-sm-6">
        <label class="titleBar center">{{ 'dtcTransaction.mrzData' | translate }}</label>
        <div class="app-card cardSetting">
          <!-- FORM START -->

            <!-- BusinessID Feild -->
            <div class="form-group">
              <label for="dg1">{{ 'dtc.firstName' | translate }}</label>
              <p name="dg1">{{user.mrz.firstName}}</p>
            </div>
            <div class="form-group">
              <label for="dg1">{{ 'dtc.lastName' | translate }}</label>
              <p name="dg1">{{user.mrz.lastName}}</p>
            </div>
            <div class="form-group">
              <label for="dg1">{{ 'dtc.documentNumber' | translate }}</label>
              <p name="dg1">{{user.mrz.documentNumber}}</p>
            </div>
            <div class="form-group">
              <label for="dg1">{{ 'dtc.dateOfBirth' | translate }}</label>
              <p name="dg1">{{user.mrz.dateOfBirth}}</p>
            </div>
            <div class="form-group">
              <label for="dg1">{{ 'dtcTransaction.issuingCountry' | translate }}</label>
              <p name="dg1">{{user.mrz.issuingCountry}}</p>
            </div>
            <div class="form-group">
              <label for="dg1">{{ 'dtcTransaction.nationality' | translate }}</label>
              <p name="dg1">{{user.mrz.nationality}}</p>
            </div>
          <label class="titleBar center">{{ 'dtcTransaction.portrait' | translate }}</label>
          <div class="app-card cardSetting">
          <!-- FORM START -->

            <!-- BusinessID Feild -->
            <div class="form-group">
              <img *ngIf="jpegImageBase64" [src]="jpegImageBase64" [alt]="'dtcTransaction.portraitUnsupported' | translate" />
            </div>
          </div>
        </div>
      </div>
      <div class="col-sm-6">
        <label class="titleBar center">{{ 'dtcTransaction.nfcData' | translate }}</label>
        <div class="app-card cardSetting">
          <!-- FORM START -->
          <div class="form-group">
            <label for="dg1">DG1</label>
            <textarea rows=3 name="dg1" [(ngModel)]="user.dg1">{{user.dg1}}</textarea>
          </div>
          <div class="form-group">
            <label for="dg2">DG2</label>
            <textarea rows=3 name="dg2" [(ngModel)]="user.dg2">{{user.dg2}}</textarea>
          </div>
          <div class="form-group">
            <label for="dg3">DG3</label>
            <textarea rows=3 name="dg3" [(ngModel)]="user.dg3">{{user.dg3}}</textarea>
          </div>
          <div class="form-group">
            <label for="dg4">DG4</label>
            <textarea rows=3 name="dg4" [(ngModel)]="user.dg4">{{user.dg4}}</textarea>
          </div>
          <div class="form-group">
            <label for="dg5">DG5</label>
            <textarea rows=3 name="dg5" [(ngModel)]="user.dg5">{{user.dg5}}</textarea>
          </div>
          <div class="form-group">
            <label for="dg6">DG6</label>
            <textarea rows=3 name="dg6" [(ngModel)]="user.dg6">{{user.dg6}}</textarea>
          </div>
          <div class="form-group">
            <label for="dg7">DG7</label>
            <textarea rows=3 name="dg7" [(ngModel)]="user.dg7">{{user.dg7}}</textarea>
          </div>
          <div class="form-group">
            <label for="dg8">DG8</label>
            <textarea rows=3 name="dg8" [(ngModel)]="user.dg8">{{user.dg8}}</textarea>
          </div>
          <div class="form-group">
            <label for="dg9">DG9</label>
            <textarea rows=3 name="dg9" [(ngModel)]="user.dg9">{{user.dg9}}</textarea>
          </div>
          <div class="form-group">

            <textarea rows=3 name="dg10" [(ngModel)]="user.dg10">{{user.dg10}}</textarea>
          </div>
          <div class="form-group">

          <div class="form-group">

          </div>
          <div class="form-group">
            <label for="dg13">DG13</label>

          </div>
          <div class="form-group">
            <label for="dg14">DG14</label>
            <textarea rows=3 name="dg14" [(ngModel)]="user.dg14">{{user.dg14}}</textarea>
          </div>
          <div class="form-group">

          <div class="form-group">

            <textarea rows=3 name="sod" [(ngModel)]="user.sod">{{user.sod}}</textarea>
          </div>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col-sm-12 center" style="white-space: nowrap;">
        <button (click)="createTransaction()" class="button">{{ 'dtc.createTransaction' | translate }}</button>
      </div>
    </div>
  </div>

</div>
