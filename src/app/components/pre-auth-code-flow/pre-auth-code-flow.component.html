<div class="app-container">
    <a class="back-link" routerLink="/home"><i class="bi bi-arrow-left" aria-hidden="true"></i> {{ 'common.back' | translate }}</a>
    <h1 class="page-title">{{ ('useCases.' + useCaseId) | translate }}</h1>
    <p class="page-subtitle">{{ 'preAuth.subtitle' | translate }}</p>

    <label class="titleBar">{{ 'preAuth.holders' | translate }}</label>
    <div class="app-card cardSetting table-card">
        <div class="table-wrap">
            <table mat-table [dataSource]="dataSet" class="table">
                <ng-container matColumnDef="action">
                    <th mat-header-cell *matHeaderCellDef> {{ 'preAuth.createOffer' | translate }} </th>
                    <td mat-cell *matCellDef="let element">
                        <button type="button" (click)="createOffer(element)"><i class="bi bi-qr-code" aria-hidden="true"></i> {{ 'preAuth.create' | translate }}</button>
                    </td>
                </ng-container>

                <ng-container *ngFor="let column of dynamicColumns" [matColumnDef]="column">
                    <th mat-header-cell *matHeaderCellDef>{{ columnLabel(column) }}</th>
                    <td mat-cell *matCellDef="let elt" class="wrap-cell">{{ getAttributeValue(elt, column) }}</td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
            </table>
        </div>
    </div>
</div>
